AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"

# The codebase uses trailing commas in multiline collections; keep them.
Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: consistent_comma
Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma

# The library is written with double quotes throughout; match it.
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# get_value(s) / set_value(s) deliberately mirror the libgpiod C API names.
Naming/AccessorMethodName:
  Enabled: false

# Allow domain abbreviations such as `hz` and `us`, screen coordinates and
# sizes (`x`, `y`, `w`, `h`), and an encoder's phase names (`a`, `b`).
Naming/MethodParameterName:
  MinNameLength: 2
  AllowedNames: [as, at, by, cc, db, id, if, in, io, ip, of, on, os, pp, to, hz, us, x, y, w, h, a, b]

# Hardware identifiers (bcm2711, rp1, uint32, int32) are not "numbered vars".
Naming/VariableNumber:
  Enabled: false

# Terse `expr rescue fallback` is used intentionally for optional sysfs reads.
Style/RescueModifier:
  Enabled: false

# Low-level binding code has legitimately long methods and a long Native module.
Metrics/MethodLength:
  Max: 45
Metrics/AbcSize:
  Max: 40
Metrics/CyclomaticComplexity:
  Max: 12
Metrics/PerceivedComplexity:
  Max: 12
Metrics/ClassLength:
  Max: 220
  # A test class is a list of cases; splitting one to fit a line count would
  # scatter tests that belong together.
  Exclude:
    - "test/**/*"
Metrics/ModuleLength:
  Max: 260

# request_lines is an options-style API; keyword args should not count here.
Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "examples/**/*"
    - "*.gemspec"

# wait_edge_events mirrors the libgpiod C call: it blocks/waits and reports
# readiness; it is an action, not a pure predicate, so no `?` suffix.
#
# Device#value mirrors gpiozero's `value` attribute, the name the book's readers
# already know. It is boolean for digital devices but a 0.0–1.0 ratio for the
# PWM-backed ones, so a `?` suffix would be wrong.
Naming/PredicateMethod:
  AllowedMethods:
    - wait_edge_events
    - value

# Hardware code formats register values as hex: `format("0x%02x", address)` is
# the clearest way to write that, and naming every placeholder adds noise.
Style/FormatStringToken:
  EnforcedStyle: unannotated

# Development dependencies are declared in the gemspec by choice.
Gemspec/DevelopmentDependencies:
  Enabled: false

# The gem does not use the frozen-string-literal magic comment: it is noise in
# every file, and Ruby 3.4+ warns on mutation rather than needing it per-file.
Style/FrozenStringLiteralComment:
  Enabled: false
