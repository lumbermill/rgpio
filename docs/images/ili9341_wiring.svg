<svg xmlns="http://www.w3.org/2000/svg" width="680" height="510" viewBox="0 0 680 510" role="img">
<title>ILI9341 TFT module wiring to Raspberry Pi</title>
<desc>Header pins 1 to 26 with the used pins highlighted, and wires from each Pi pin to the TFT module pins: power in gray, display in purple, touch in dashed teal. SDO is left unconnected.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;fill:#1f2328}
.s{font-size:12px;fill:#59636e}.h{font-weight:600}
.box{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}
.pin{fill:none;stroke:#d1d9e0;stroke-width:1}.open{fill:none;stroke:#8c959f;stroke-width:1;stroke-dasharray:4 3}
.gray{fill:#F1EFE8;stroke:#5F5E5A}.purple{fill:#EEEDFE;stroke:#534AB7}.teal{fill:#E1F5EE;stroke:#0F6E56}
.gray-t{fill:#444441}.purple-t{fill:#3C3489}.teal-t{fill:#085041}
.w-gray{stroke:#888780}.w-purple{stroke:#7F77DD}.w-teal{stroke:#1D9E75;stroke-dasharray:5 3}
line{stroke-width:2}
@media (prefers-color-scheme:dark){
text{fill:#f0f6fc}.s{fill:#9198a1}
.box{fill:#151b23;stroke:#3d444d}.pin{stroke:#3d444d}.open{stroke:#656c76}
.gray{fill:#444441;stroke:#B4B2A9}.purple{fill:#3C3489;stroke:#AFA9EC}.teal{fill:#085041;stroke:#5DCAA5}
.gray-t{fill:#F1EFE8}.purple-t{fill:#EEEDFE}.teal-t{fill:#E1F5EE}
}
</style>
<text class="s" x="95" y="46" text-anchor="middle">header pins</text>
<text class="h" x="275" y="46" text-anchor="middle">Raspberry Pi</text>
<text class="h" x="545" y="46" text-anchor="middle">TFT module</text>
<circle class="gray" cx="80" cy="70" r="7"/>
<circle class="pin" cx="110" cy="70" r="6"/>
<text class="s" x="66" y="74" text-anchor="end">1</text><text class="s" x="124" y="74">2</text>
<circle class="pin" cx="80" cy="98" r="6"/>
<circle class="pin" cx="110" cy="98" r="6"/>
<text class="s" x="66" y="102" text-anchor="end">3</text><text class="s" x="124" y="102">4</text>
<circle class="pin" cx="80" cy="126" r="6"/>
<circle class="gray" cx="110" cy="126" r="7"/>
<text class="s" x="66" y="130" text-anchor="end">5</text><text class="s" x="124" y="130">6</text>
<circle class="pin" cx="80" cy="154" r="6"/>
<circle class="pin" cx="110" cy="154" r="6"/>
<text class="s" x="66" y="158" text-anchor="end">7</text><text class="s" x="124" y="158">8</text>
<circle class="pin" cx="80" cy="182" r="6"/>
<circle class="pin" cx="110" cy="182" r="6"/>
<text class="s" x="66" y="186" text-anchor="end">9</text><text class="s" x="124" y="186">10</text>
<circle class="teal" cx="80" cy="210" r="7"/>
<circle class="purple" cx="110" cy="210" r="7"/>
<text class="s" x="66" y="214" text-anchor="end">11</text><text class="s" x="124" y="214">12</text>
<circle class="pin" cx="80" cy="238" r="6"/>
<circle class="pin" cx="110" cy="238" r="6"/>
<text class="s" x="66" y="242" text-anchor="end">13</text><text class="s" x="124" y="242">14</text>
<circle class="pin" cx="80" cy="266" r="6"/>
<circle class="pin" cx="110" cy="266" r="6"/>
<text class="s" x="66" y="270" text-anchor="end">15</text><text class="s" x="124" y="270">16</text>
<circle class="pin" cx="80" cy="294" r="6"/>
<circle class="purple" cx="110" cy="294" r="7"/>
<text class="s" x="66" y="298" text-anchor="end">17</text><text class="s" x="124" y="298">18</text>
<circle class="purple" cx="80" cy="322" r="7"/>
<circle class="pin" cx="110" cy="322" r="6"/>
<text class="s" x="66" y="326" text-anchor="end">19</text><text class="s" x="124" y="326">20</text>
<circle class="teal" cx="80" cy="350" r="7"/>
<circle class="purple" cx="110" cy="350" r="7"/>
<text class="s" x="66" y="354" text-anchor="end">21</text><text class="s" x="124" y="354">22</text>
<circle class="purple" cx="80" cy="378" r="7"/>
<circle class="purple" cx="110" cy="378" r="7"/>
<text class="s" x="66" y="382" text-anchor="end">23</text><text class="s" x="124" y="382">24</text>
<circle class="pin" cx="80" cy="406" r="6"/>
<circle class="teal" cx="110" cy="406" r="7"/>
<text class="s" x="66" y="410" text-anchor="end">25</text><text class="s" x="124" y="410">26</text>
<line class="w-gray" x1="370" y1="70" x2="470" y2="70"/>
<line class="w-gray" x1="370" y1="98" x2="470" y2="98"/>
<line class="w-purple" x1="370" y1="126" x2="470" y2="126"/>
<line class="w-purple" x1="370" y1="154" x2="470" y2="154"/>
<line class="w-purple" x1="370" y1="182" x2="470" y2="182"/>
<line class="w-purple" x1="370" y1="210" x2="470" y2="210"/>
<line class="w-teal" x1="370" y1="210" x2="470" y2="378"/>
<line class="w-purple" x1="370" y1="238" x2="470" y2="238"/>
<line class="w-teal" x1="370" y1="238" x2="470" y2="322"/>
<line class="w-purple" x1="370" y1="266" x2="470" y2="266"/>
<line class="w-teal" x1="370" y1="350" x2="470" y2="350"/>
<line class="w-teal" x1="370" y1="406" x2="470" y2="406"/>
<line class="w-teal" x1="370" y1="434" x2="470" y2="434"/>
<rect class="box" x="180" y="59" width="190" height="22" rx="4"/><text x="192" y="75">pin 1 · 3.3V</text>
<rect class="box" x="180" y="87" width="190" height="22" rx="4"/><text x="192" y="103">pin 6 · GND</text>
<rect class="box" x="180" y="115" width="190" height="22" rx="4"/><text x="192" y="131">pin 24 · GPIO8 (CE0)</text>
<rect class="box" x="180" y="143" width="190" height="22" rx="4"/><text x="192" y="159">pin 22 · GPIO25</text>
<rect class="box" x="180" y="171" width="190" height="22" rx="4"/><text x="192" y="187">pin 18 · GPIO24</text>
<rect class="box" x="180" y="199" width="190" height="22" rx="4"/><text x="192" y="215">pin 19 · GPIO10 (MOSI)</text>
<rect class="box" x="180" y="227" width="190" height="22" rx="4"/><text x="192" y="243">pin 23 · GPIO11 (SCLK)</text>
<rect class="box" x="180" y="255" width="190" height="22" rx="4"/><text x="192" y="271">pin 12 · GPIO18</text>
<rect class="box" x="180" y="339" width="190" height="22" rx="4"/><text x="192" y="355">pin 26 · GPIO7 (CE1)</text>
<rect class="box" x="180" y="395" width="190" height="22" rx="4"/><text x="192" y="411">pin 21 · GPIO9 (MISO)</text>
<rect class="box" x="180" y="423" width="190" height="22" rx="4"/><text x="192" y="439">pin 11 · GPIO17</text>
<rect class="gray" x="470" y="59" width="150" height="22" rx="4"/><text class="gray-t" x="482" y="75">VCC</text>
<rect class="gray" x="470" y="87" width="150" height="22" rx="4"/><text class="gray-t" x="482" y="103">GND</text>
<rect class="purple" x="470" y="115" width="150" height="22" rx="4"/><text class="purple-t" x="482" y="131">CS</text>
<rect class="purple" x="470" y="143" width="150" height="22" rx="4"/><text class="purple-t" x="482" y="159">RESET</text>
<rect class="purple" x="470" y="171" width="150" height="22" rx="4"/><text class="purple-t" x="482" y="187">DC</text>
<rect class="purple" x="470" y="199" width="150" height="22" rx="4"/><text class="purple-t" x="482" y="215">SDI (MOSI)</text>
<rect class="purple" x="470" y="227" width="150" height="22" rx="4"/><text class="purple-t" x="482" y="243">SCK</text>
<rect class="purple" x="470" y="255" width="150" height="22" rx="4"/><text class="purple-t" x="482" y="271">LED</text>
<rect class="open" x="470" y="283" width="150" height="22" rx="4"/><text class="s" x="482" y="298">SDO (leave open)</text>
<rect class="teal" x="470" y="311" width="150" height="22" rx="4"/><text class="teal-t" x="482" y="327">T_CLK</text>
<rect class="teal" x="470" y="339" width="150" height="22" rx="4"/><text class="teal-t" x="482" y="355">T_CS</text>
<rect class="teal" x="470" y="367" width="150" height="22" rx="4"/><text class="teal-t" x="482" y="383">T_DIN</text>
<rect class="teal" x="470" y="395" width="150" height="22" rx="4"/><text class="teal-t" x="482" y="411">T_DO</text>
<rect class="teal" x="470" y="423" width="150" height="22" rx="4"/><text class="teal-t" x="482" y="439">T_IRQ</text>
<line class="w-gray" x1="200" y1="478" x2="226" y2="478"/><text class="s" x="232" y="482">power</text>
<line class="w-purple" x1="300" y1="478" x2="326" y2="478"/><text class="s" x="332" y="482">display</text>
<line class="w-teal" x1="410" y1="478" x2="436" y2="478"/><text class="s" x="442" y="482">touch (touch_paint.rb)</text>
</svg>
